/* ===================================================================
   ELEVATION (Figma effect styles, §7.1)
   =================================================================== */
:root {
  --shadow-resting-cards: 0 1px 3px rgba(0, 0, 0, .05);
  --shadow-floating-nav: 0 2px 8px rgba(20, 15, 10, .08), 0 8px 30px rgba(20, 15, 10, .16);
  /* Motion: everything eases in and out (same curve as the Figma motion tracks) */
  --ease-in-out: cubic-bezier(.42, 0, .58, 1);
  --motion-enter: 360ms;
  --motion-scroll: 450ms;

/* ===================================================================
   BASE
   =================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: var(--font-body-m);
  font-feature-settings: "case" 1;
  -webkit-font-smoothing: antialiased;
  color: var(--text-primary);
  background: var(--bg-secondary);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible {
  outline: 2px solid var(--border-focused);
  outline-offset: 2px;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ===================================================================
   DESKTOP STAGE: phone frame + demo panel (§13.1, §13.6)
   =================================================================== */
.stage {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-xl);
}
/* Device chrome is presentation only, so its colours aren't design tokens */
.phone {
  --bezel: 12px;
  --screen-radius: 44px;
  --device: #1C1C1E;
  position: relative;
  /* Screen stays 375 × 812; the bezel sits outside it */
  width: calc(var(--width-frame) + 2 * var(--bezel));
  /* never taller than the window, so the whole app stays visible */
  height: min(812px + 2 * var(--bezel), calc(100dvh - 2 * var(--space-xl)));
  flex: none;
  padding: var(--bezel);
  border-radius: calc(var(--screen-radius) + var(--bezel));
  background: var(--device);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, .08),
    0 0 0 1px rgba(0, 0, 0, .6),
    0 2px 8px rgba(20, 15, 10, .10),
    0 24px 60px rgba(20, 15, 10, .22);
}
.phone .app { border-radius: var(--screen-radius); }
/* Dynamic island */
.phone::before {
  content: "";
  position: absolute;
  z-index: 5;
  top: calc(var(--bezel) + 10px);
  left: 50%;
  width: 120px;
  height: 32px;
  transform: translateX(-50%);
  border-radius: var(--radius-full);
  background: #000;
  pointer-events: none;
}
/* Side buttons: action + volume on the left, power on the right */
.phone::after {
  content: "";
  position: absolute;
  left: -3px;
  top: 120px;
  width: 3px;
  height: 168px;
  border-radius: 2px 0 0 2px;
  background: linear-gradient(to bottom,
    var(--device) 0 32px, transparent 32px 56px,
    var(--device) 56px 112px, transparent 112px 124px,
    var(--device) 124px);
  pointer-events: none;
}
.power-button {
  position: absolute;
  right: -3px;
  top: 180px;
  width: 3px;
  height: 96px;
  border-radius: 0 2px 2px 0;
  background: var(--device);
}

/* ===================================================================
   APP
   =================================================================== */
.app {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
}

/* Status bar (generic, not exported) */
.status-bar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-3xl) 0 var(--space-4xl);
  font: var(--font-title-s);
  color: var(--text-primary);
  background: var(--bg-primary);
}
.status-bar .sys { display: flex; gap: var(--space-xs); align-items: center; color: var(--fg-primary); }

/* Header-full (§8.2) */
.header {
  height: 64px;
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--space-m);
  padding: var(--space-m) var(--space-xl);
  background: var(--bg-primary);
  position: relative;
  z-index: 2;
}
.header h1 {
  flex: 1;
  margin: 0;
  font: var(--font-title-l);
  color: var(--text-primary);
}
.header .actions { display: flex; gap: var(--space-m); }
.nav-button {
  width: 48px;
  height: 48px;
  padding: var(--space-l);
  border: 0;
  border-radius: var(--radius-full);
  background: var(--bg-secondary);
  color: var(--fg-primary);
  box-shadow: var(--shadow-resting-cards);
  display: grid;
  place-items: center;
}
.nav-button svg { width: 24px; height: 24px; display: block; }

/* Body area between header and bottom */
.body {
  position: relative;
  flex: 1;
  min-height: 0;
}

/* Intro / empty state (§8.7) */
.intro {
  position: absolute;
  inset: 0 0 104px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 var(--screen-margin);
}
.intro-block {
  width: 100%;
  max-width: var(--width-content);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-xl);
  text-align: center;
}
.mascot {
  width: 100px;
  height: 100px;
  display: block;
}
/* Mascot motion: Figma "Morning stretch · 2s loop" (animations page, frame 35:1509).
   Keyframes copied from the Figma motion tracks. Each group turns around its
   Figma pivot, which is the group's local origin. Default easing is
   ease-in-out; the settle at the end (.22,0,.25,1) and the blink (.18,0,.2,1)
   use the custom curves from Figma. (In CSS a keyframe's timing function shapes the segment that
   starts there, so each custom curve sits on the keyframe before the one it
   was set on in Figma.) */
.mascot {
  overflow: visible;
}
.mascot .m-body, .mascot .m-head, .mascot .m-eye {
  transform-box: view-box;
  transform-origin: 0 0;
  animation-duration: 2s;
  animation-timing-function: var(--ease-in-out);
  animation-iteration-count: infinite;
}
.mascot .m-body { animation-name: m-body-rotate, m-body-lift; }
.mascot .m-head { animation-name: m-head-rotate; }
.mascot .m-eye { animation-name: m-eye-blink; }

/* Body and arms, rotation: a gentle side-to-side stretch that settles */
@keyframes m-body-rotate {
  0% { rotate: 0deg; }
  7% { rotate: -.5deg; }
  21.5% { rotate: 1.8deg; }
  34.5% { rotate: -1.1deg; }
  47% { rotate: 1.2deg; }
  59% { rotate: -.8deg; }
  71.5% { rotate: .55deg; animation-timing-function: cubic-bezier(.22, 0, .25, 1); }
  89% { rotate: -.15deg; }
  100% { rotate: 0deg; }
}
/* Body and arms, Y: small dip, then lifts 1.1px into the stretch and holds */
@keyframes m-body-lift {
  0% { translate: 0 0; }
  8% { translate: 0 .45px; }
  25% { translate: 0 -1.1px; }
  39% { translate: 0 -.7px; }
  67% { translate: 0 -.7px; }
  86% { translate: 0 .2px; }
  100% { translate: 0 0; }
}
/* Head, follow-through: swings wider than the body */
@keyframes m-head-rotate {
  0% { rotate: 0deg; }
  9.5% { rotate: -1.1deg; }
  24.5% { rotate: 3.5deg; }
  37.5% { rotate: -2.5deg; }
  50% { rotate: 2.6deg; }
  62% { rotate: -1.8deg; }
  74.5% { rotate: 1.2deg; animation-timing-function: cubic-bezier(.22, 0, .25, 1); }
  92.5% { rotate: -.3deg; }
  100% { rotate: 0deg; }
}
/* Both eyes, one natural blink */
@keyframes m-eye-blink {
  0% { scale: 1 1; }
  11% { scale: 1 1; animation-timing-function: cubic-bezier(.18, 0, .2, 1); }
  14.5% { scale: 1 .075; }
  16.5% { scale: 1 .075; animation-timing-function: cubic-bezier(.18, 0, .2, 1); }
  23% { scale: 1 1; }
  100% { scale: 1 1; }
}
@media (prefers-reduced-motion: reduce) {
  .mascot .m-body, .mascot .m-head, .mascot .m-eye { animation: none; }
}
.intro-text { display: flex; flex-direction: column; gap: var(--space-xs); }

/* Intro motion: the mascot, then the text, rise in. On the first message the
   intro fades up and away while the conversation rises in beneath it. */
.app[data-screen="intro"] .intro-block > * {
  animation: intro-in 300ms var(--ease-in-out) backwards;
}
.app[data-screen="intro"] .intro-text { animation-delay: 80ms; }
.app[data-screen="chat"] .intro {
  pointer-events: none;
  animation: intro-out 240ms var(--ease-in-out) forwards;
}
@keyframes intro-in {
  from { opacity: 0; transform: translateY(16px); }
}
@keyframes intro-out {
  to { opacity: 0; transform: translateY(-12px) scale(.98); visibility: hidden; }
}
@media (prefers-reduced-motion: reduce) {
  .app[data-screen="intro"] .intro-block > * { animation: none; }
  .app[data-screen="chat"] .intro { animation: none; display: none; }
}
.intro h2 { margin: 0; font: var(--font-headline-m); color: var(--text-primary); }
.intro p { margin: 0; font: var(--font-body-m); color: var(--text-secondary); }

/* Message log (§8.1, §6.3) */
.log {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: var(--space-xl) var(--screen-margin) 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-xl);
  scrollbar-width: none;
  overflow-anchor: none; /* scrolling is handled in JS */
}
.log::-webkit-scrollbar { display: none; }
/* Room under the last message so it can scroll clear of the composer (104).
   A spacer, not padding-bottom: Safari leaves a flex scroller's bottom
   padding out of the scroll area. The log gap adds the other 16. */
.log::after { content: ""; flex: none; height: 104px; }

.app[data-screen="intro"] .log { display: none; }
.app[data-screen="intro"] #new-chat { display: none; }

/* Date badge — Badge-primary (§8.3) */
.date-badge {
  align-self: center;
  display: inline-flex;
  gap: var(--space-xs);
  padding: var(--space-xxs) var(--space-m);
  border-radius: var(--radius-full);
  background: var(--bg-secondary);
  box-shadow: var(--shadow-resting-cards);
  font: var(--font-label-s);
  color: var(--text-secondary);
  /* badge → first message is 24 (Space-3XL); the log gap supplies 16 */
  margin-bottom: calc(var(--space-3xl) - var(--space-xl));
}

/* Messages */
.msg {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  animation: rise-in var(--motion-enter) var(--ease-in-out) backwards;
}
.msg .time { font: var(--font-caption-s); color: var(--text-tertiary); }

/* User bubble (§8.4) */
.msg.user { align-items: flex-end; }
.msg.user .bubble {
  max-width: 100%;
  padding: var(--space-l) var(--space-xl);
  background: var(--bg-brand);
  color: var(--text-inverse);
  font: var(--font-label-m);
  border-radius: var(--radius-l) var(--radius-l) var(--radius-xs) var(--radius-l);
  box-shadow: var(--shadow-resting-cards);
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

/* Assistant message, no bubble (§8.5) */
.msg.assistant { align-items: stretch; }
.msg.assistant .blocks {
  display: flex;
  flex-direction: column;
  gap: var(--space-xl);
  font: var(--font-label-m);
  color: var(--text-tertiary);
  overflow-wrap: anywhere;
}
.msg.assistant p { margin: 0; }
.msg.assistant ul { margin: 0; padding-left: 15px; }
.msg.assistant li { padding-left: var(--space-s); }
.msg.assistant li::marker { content: "•"; }

/* Thinking placeholder (§7.2): "Thinking..." with a shimmer sweeping across it */
.thinking {
  align-self: flex-start;
  font: var(--font-label-m);
  color: var(--text-tertiary);
  animation: rise-in var(--motion-enter) var(--ease-in-out) backwards;
}
.thinking span {
  color: transparent;
  background: linear-gradient(90deg,
    var(--text-tertiary) 0%, var(--text-tertiary) 35%,
    var(--text-disabled) 50%,
    var(--text-tertiary) 65%, var(--text-tertiary) 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  animation: shimmer 1.6s var(--ease-in-out) infinite;
}

@keyframes rise-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes shimmer {
  from { background-position: 100% 0; }
  to { background-position: 0% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .msg, .thinking, .card { animation: none; }
  .thinking span { animation: none; color: var(--text-tertiary); background: none; }
}

/* Review card: Figma "Card" in the transfer, bill payment and FD frames.
   Text Box (overline + amount) · Divider · List-base rows (Size3) ·
   Pill-buttons (Tertiary + Secondary, trailing icon) · note. */
.msg.assistant .card { margin-top: var(--space-m); } /* 4 (msg gap) + 8 = 12, as in Figma */
.card {
  display: flex;
  flex-direction: column;
  gap: var(--space-xl);
  padding: var(--card-padding);
  border-radius: var(--radius-m);
  background: var(--bg-secondary);
  box-shadow: var(--shadow-resting-cards);
  animation: rise-in var(--motion-enter) var(--ease-in-out) backwards;
}
.card p { margin: 0; }
.card-overline { font: var(--font-label-s); color: var(--text-tertiary); }
.card-amount { font: var(--font-headline-m); color: var(--text-primary); }
.card-sub { margin-top: var(--space-xs) !important; font: var(--font-body-m); color: var(--text-secondary); }
.card-divider { margin: 0; height: 1px; border: 0; background: var(--border-default); }
.card-rows { margin: 0; display: flex; flex-direction: column; gap: var(--space-l); }
.card-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-l);
}
.card-row dt { font: var(--font-label-m); color: var(--text-primary); flex: none; }
.card-row dd { margin: 0; font: var(--font-label-s); color: var(--text-tertiary); text-align: right; }
.card-actions { display: flex; gap: var(--button-gap); }
.card-note { font: var(--font-body-m); color: var(--text-secondary); }
.card-amount-row { display: flex; align-items: flex-end; gap: var(--space-m); }
.card-amount-row .badge { margin-bottom: var(--space-xs); }

/* Badge - indicator, Size=Small: red when spending goes up, green when it
   goes down, yellow when it holds */
.badge {
  flex: none;
  padding: 1px 3px;
  border-radius: var(--radius-full);
  background: var(--fg-error);
  font: var(--font-caption-s);
  color: var(--fg-white-both);
}
.badge.down { background: var(--fg-success); }
.badge.flat { background: var(--fg-warning); }

/* Spending card: category rows with a Progress bar (Size=Small) */
/* Not chat bullet lists: no indent or marker inside a card */
.msg.assistant .card ul { padding-left: 0; }
.msg.assistant .card li { padding-left: 0; }
.msg.assistant .card li::marker { content: none; }
.card-bars, .card-changes {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--space-xl);
}
.card-bar { display: flex; flex-direction: column; gap: var(--space-l); }
.card-bar-head, .card-change {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-l);
}
.card-bar-label, .card-change-label { font: var(--font-label-m); color: var(--text-primary); }
.card-bar-values { display: flex; gap: var(--space-xs); font: var(--font-label-s); color: var(--text-tertiary); white-space: nowrap; }
.card-bar-share { color: var(--text-secondary); }
.bar { height: 4px; border-radius: var(--radius-xs); background: var(--bg-tertiary); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: inherit; background: var(--bg-brand); }

/* Comparison card: List-base rows (Size3), body text + trailing amount and badge */
.card-change-sub { font: var(--font-body-s); color: var(--text-secondary); }
.card-change-trail { display: flex; align-items: center; gap: var(--space-m); font: var(--font-label-s); color: var(--text-tertiary); white-space: nowrap; }

/* Pill-button inside a reply (e.g. "Try again"): hugs its label */
.msg.assistant .blocks > .pill { align-self: flex-start; flex: none; }

/* Pill-button, Size=Small (40) */
.pill {
  height: 40px;
  padding: var(--space-m) var(--space-xl);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-m);
  border: 0;
  border-radius: var(--radius-full);
  background: transparent;
  font: var(--font-button-m);
  color: var(--text-action);
  white-space: nowrap;
}
.pill svg { width: 20px; height: 20px; flex: none; color: var(--fg-action); }
.pill.secondary { flex: 1; border: 1px solid var(--border-action-primary); }
.pill.tertiary:not(:disabled):active { color: var(--text-action-pressed); }
.pill.secondary:not(:disabled):active { background: var(--bg-action-secondary-pressed); }

/* Composer — Chat field, Small (§8.6) */
.composer {
  pointer-events: none; /* the gradient fade lets scrolling through */
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: var(--space-m);
  padding: var(--space-6xl) var(--screen-margin) var(--space-xl);
  background: linear-gradient(to bottom, var(--alpha-shade) 0%, var(--bg-primary) 74%);
}
.composer > * { pointer-events: auto; }
.field {
  flex: 1;
  min-width: 0;
  height: 40px;
  display: flex;
  align-items: center;
  padding: var(--space-m) var(--space-xl);
  background: var(--bg-secondary);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-floating-nav);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.field input {
  width: 100%;
  border: 0;
  outline: 0;
  padding: 0;
  background: transparent;
  font: var(--font-body-l);
  color: var(--text-primary);
}
.field input::placeholder { color: var(--text-placeholder); opacity: 1; }

.send {
  position: relative;
  flex: none;
  width: 36px;
  height: 36px;
  padding: var(--space-m);
  border: 0;
  border-radius: var(--radius-full);
  display: grid;
  place-items: center;
  background: var(--bg-disabled);
  color: var(--fg-disabled-on-bg);
  transition: background-color 150ms;
}
/* 44 × 44 hit area without changing the look (§11) */
.send::after { content: ""; position: absolute; inset: -4px; }
.send svg { width: 20px; height: 20px; display: block; }
/* Placeholder: enabled state isn't designed (§8.6) */
.send:not(:disabled) { background: var(--bg-action-primary); color: var(--fg-inverse); }
.send:not(:disabled):active { background: var(--bg-action-primary-pressed); }
.send:disabled { cursor: default; }

/* ===================================================================
   DEMO CONTROLS (desktop only, not part of the design)
   A button in the bottom-right corner opens them as a small popup.
   =================================================================== */
.demo-toggle {
  position: fixed;
  right: var(--space-3xl);
  bottom: var(--space-3xl);
  z-index: 10;
  height: 48px;
  padding: 0 var(--space-xl) 0 var(--space-l);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-full);
  background: var(--bg-secondary);
  color: var(--text-primary);
  box-shadow: var(--shadow-resting-cards);
  display: inline-flex;
  align-items: center;
  gap: var(--icon-text);
  font: var(--font-label-m);
  white-space: nowrap;
  transition: background-color 200ms var(--ease-in-out), color 200ms var(--ease-in-out);
}
.demo-toggle svg { width: 24px; height: 24px; display: block; flex: none; }
.demo-toggle:hover { background: var(--bg-active); }
.demo-toggle[aria-expanded="true"] { background: var(--bg-active); color: var(--text-action); border-color: var(--border-active); }
.demo {
  position: fixed;
  right: var(--space-3xl);
  bottom: calc(var(--space-3xl) + 48px + var(--space-m));
  z-index: 10;
  width: 264px;
  display: flex;
  flex-direction: column;
  gap: var(--space-xl);
  padding: var(--space-xl);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-l);
  background: var(--bg-secondary);
  box-shadow: var(--shadow-floating-nav);
  color: var(--text-primary);
  transform-origin: bottom right;
  animation: pop-in 200ms var(--ease-in-out) backwards;
}
.demo[hidden] { display: none; }
@keyframes pop-in {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
}
@media (prefers-reduced-motion: reduce) {
  .demo { animation: none; }
}
.demo .group { display: flex; flex-direction: column; gap: var(--space-m); }
.demo label { font: var(--font-label-s); color: var(--text-secondary); }
/* Native arrow hidden (Chrome ignores padding around it); Figma nav-arrow-down instead */
.demo .select { position: relative; }
.demo .select svg {
  position: absolute;
  right: var(--space-l);
  top: 50%;
  width: 20px;
  height: 20px;
  transform: translateY(-50%);
  color: var(--fg-secondary);
  pointer-events: none;
}
.demo select {
  width: 100%;
  height: 40px;
  padding: 0 calc(var(--space-l) + 20px + var(--space-m)) 0 var(--space-l);
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-m);
  background: var(--bg-primary);
  color: var(--text-primary);
  font: var(--font-body-m);
}
/* Sub-scenario chips under the script dropdown */
.demo .chips { display: flex; flex-wrap: wrap; gap: var(--space-m); }
.demo .chips[hidden] { display: none; }
.demo .chip {
  height: 32px;
  padding: 0 var(--space-l);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-full);
  background: var(--bg-primary);
  font: var(--font-label-s);
  color: var(--text-primary);
  white-space: nowrap;
  cursor: pointer;
}
.demo .chip:hover { background: var(--bg-active); border-color: var(--border-active); }
.demo .row { display: flex; gap: var(--space-m); }
.demo .btn {
  white-space: nowrap;
  flex: 1;
  height: 40px;
  padding: 0 var(--space-l);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-full);
  background: var(--bg-primary);
  font: var(--font-button-s);
  color: var(--text-primary);
}
.demo .btn:hover { background: var(--bg-active); }
.demo .btn.primary { background: var(--bg-action-primary); border-color: transparent; color: var(--text-inverse); }
.demo .btn.primary:hover { background: var(--bg-action-primary-pressed); }
.demo .btn[aria-pressed="true"] { background: var(--bg-active); border-color: var(--border-active); }
.demo .next {
  padding: var(--space-l);
  border-radius: var(--radius-m);
  background: var(--bg-primary);
  font: var(--font-body-s);
  color: var(--text-secondary);
}

/* ===================================================================
   PHONE (≤ 760px): full-bleed, no demo panel, no fake status bar
   =================================================================== */
@media (max-width: 760px) {
  body { background: var(--bg-primary); }
  .stage { display: block; padding: 0; min-height: 0; height: 100dvh; }
  .phone { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; }
  .phone .app { border-radius: 0; }
  .phone::before, .phone::after { display: none; }
  .demo, .demo-toggle, .status-bar, .power-button { display: none !important; }
  .header { height: calc(64px + env(safe-area-inset-top)); padding-top: calc(var(--space-m) + env(safe-area-inset-top)); }
  .composer { padding-bottom: calc(var(--space-xl) + env(safe-area-inset-bottom)); }
  .log::after { height: calc(104px + env(safe-area-inset-bottom)); }
  .intro { bottom: calc(104px + env(safe-area-inset-bottom)); }
}

          ] }
        },
        "close-out": {
          "thinkingMs": 700,
          "assistant": [ { "p": "No problem. I'm here whenever you need me, so just ask." } ]
        },
        "fallback": {
          "thinkingMs": 900,
          "assistant": [ { "p": "I'm having trouble, please try again in a moment." } ]
        }
      }
    }
  ]
}
</script>

<script>
(() => {
  const data = JSON.parse(document.getElementById('scripts').textContent);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

  const $ = (id) => document.getElementById(id);
  const app = $('app'), log = $('log'), input = $('input'), send = $('send');
  const greeting = $('greeting'), nextHint = $('next-hint');

  // Figma icon: arrow-right (trailing icon of the "Confirm & continue" pill)
  const ARROW_RIGHT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12L21 12L12.5 3.5M21 12L12.5 20.5"/></svg>';

  // Figma icon: refresh-double (leading icon of the "Try again" pill)
  const REFRESH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.168 8C19.625 4.468 16.101 2 12 2C6.815 2 2.551 5.947 2.049 11M17 8L21.4 8C21.731 8 22 7.731 22 7.4L22 3M2.881 16C4.425 19.532 7.949 22 12.049 22C17.235 22 21.498 18.053 22 13M7.049 16L2.649 16C2.318 16 2.049 16.269 2.049 16.6L2.049 21"/></svg>';
  const ICONS = { refresh: REFRESH };

  let scenario, stepId, started, pending, openCard, run = 0;

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const fill = (s) => s.replace(/\{(\w+)\}/g, (m, k) => scenario.customer?.[k] ?? m);
  const clock = (d = new Date()) => d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

  // Whole-word, case-insensitive phrase matching ("no" doesn't match "know").
  const norm = (t) => ' ' + t.toLowerCase().replace(/[‘’]/g, "'").replace(/\B'|'\B/g, ' ').replace(/[^a-z0-9']+/g, ' ').trim() + ' ';
  const has = (n, k) => n.includes(norm(k));
  const hit = (text, rules = []) => {
    const n = norm(text);
    return rules.find((r) => (!r.all || r.all.every((k) => has(n, k))) && (!r.any || r.any.some((k) => has(n, k))));
  };
  const resolve = (text) =>
    hit(text, scenario.steps[stepId]?.expect?.match) ?? hit(text, scenario.routes) ?? { next: scenario.fallback };

  const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  // Eased scroll to the newest message. While one is running, new content just
  // moves its end point, so streamed text is followed without jumps. Any
  // scrolling by the user stops it.
  const MOTION_ENTER = reduceMotion.matches ? 0 : parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--motion-enter')) || 360;
  const SCROLL_MS = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--motion-scroll')) || 450;
  const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  let scrollAnim = null;
  const maxScroll = () => log.scrollHeight - log.clientHeight;
  function toBottom() {
    if (reduceMotion.matches) { log.scrollTop = maxScroll(); return; }
    if (scrollAnim || log.scrollTop >= maxScroll() - 1) return;
    const anim = { start: log.scrollTop, t0: performance.now() };
    scrollAnim = anim;
    const frame = (now) => {
      if (scrollAnim !== anim) return;
      const p = Math.min(1, (now - anim.t0) / SCROLL_MS);
      log.scrollTop = anim.start + (maxScroll() - anim.start) * easeInOut(p);
      if (p < 1) return requestAnimationFrame(frame);
      scrollAnim = null;
      if (log.scrollTop < maxScroll() - 1) toBottom(); // content grew meanwhile
    };
    requestAnimationFrame(frame);
  }
  // userScrolled: set when the person scrolls during a reply, so we never pull them back down.
  let userScrolled = false;
  const stopScroll = () => { scrollAnim = null; userScrolled = true; };
  for (const ev of ['wheel', 'touchstart', 'keydown']) log.addEventListener(ev, stopScroll, { passive: true });

  function updateSend() {
    send.disabled = pending || !input.value.trim();
  }

  function updateHint() {
    nextHint.textContent = scenario.steps[stepId]?.suggestedInput ?? '—';
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function addUser(text) {
    const m = el('div', 'msg user');
    m.append(el('span', 'sr-only', 'You said: '), el('div', 'bubble', text), el('span', 'time', clock()));
    log.append(m);
    toBottom();
  }

  async function typeInto(node, text, ms, id) {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (id !== run) return;
      // Measure only after the word is in: reading layout while the text is
      // still empty would let the browser clamp the scroll position.
      node.textContent += part;
      if (scrollAnim || nearBottom()) toBottom();
      if (part.trim()) await wait(ms);
    }
  }

  // Badge - indicator: "+10%" is red (spending up), "-4%" green, "0%" yellow
  function badge(text) {
    const tone = /^[-−]/.test(text) ? ' down' : /^\+?0(\.0+)?%$/.test(text) ? ' flat' : '';
    return el('span', 'badge' + tone, text);
  }

  // Cards (Figma "Card"): review cards in the transfer / bill / FD frames,
  // spending cards in the spending insights frames
  function renderCard(c) {
    const card = el('section', 'card');
    card.setAttribute('aria-label', c.label ?? (c.overline ? c.overline.toLowerCase() : 'Review'));

    const head = el('div', 'card-head');
    if (c.overline) head.append(el('p', 'card-overline', fill(c.overline)));
    if (c.amount) {
      const amount = el('p', 'card-amount', fill(c.amount));
      if (c.badge) {
        const row = el('div', 'card-amount-row');
        row.append(amount, badge(c.badge));
        head.append(row);
      } else head.append(amount);
    }
    if (c.sub) head.append(el('p', 'card-sub', fill(c.sub)));
    card.append(head, el('hr', 'card-divider'));

    if (c.rows) {
      const rows = el('dl', 'card-rows');
      for (const [label, value] of c.rows) {
        const row = el('div', 'card-row');
        row.append(el('dt', null, fill(label)), el('dd', null, fill(value)));
        rows.append(row);
      }
      card.append(rows);
    }

    // Category rows with a progress bar; "fill" is the bar length in %
    if (c.bars) {
      const list = el('ul', 'card-bars');
      for (const b of c.bars) {
        const item = el('li', 'card-bar');
        const head = el('div', 'card-bar-head');
        const values = el('span', 'card-bar-values');
        values.append(el('span', null, b.amount), el('span', 'card-bar-share', b.share));
        head.append(el('span', 'card-bar-label', b.label), values);
        const bar = el('div', 'bar');
        bar.setAttribute('aria-hidden', 'true');
        const fillBar = el('span');
        fillBar.style.width = b.fill + '%';
        bar.append(fillBar);
        item.append(head, bar);
        list.append(item);
      }
      card.append(list);
    }

    // Category rows comparing two periods
    if (c.changes) {
      const list = el('ul', 'card-changes');
      for (const r of c.changes) {
        const item = el('li', 'card-change');
        const text = el('div');
        text.append(el('p', 'card-change-label', r.label), el('p', 'card-change-sub', r.sub));
        const trail = el('div', 'card-change-trail');
        trail.append(el('span', null, r.amount), badge(r.change));
        item.append(text, trail);
        list.append(item);
      }
      card.append(list);
    }

    if (c.actions) {
      const actions = el('div', 'card-actions');
      const cancel = el('button', 'pill tertiary', c.cancelLabel ?? 'Cancel');
      const confirm = el('button', 'pill secondary');
      confirm.append(el('span', null, c.confirmLabel ?? 'Confirm & continue'));
      confirm.insertAdjacentHTML('beforeend', ARROW_RIGHT);
      cancel.type = confirm.type = 'button';
      cancel.addEventListener('click', () => cardAction(card, 'cancel'));
      confirm.addEventListener('click', () => cardAction(card, 'confirm'));
      actions.append(cancel, confirm);
      card.append(actions);
      card._actions = c.actions;
      card._buttons = { cancel, confirm };
    }
    if (c.note) card.append(el('p', 'card-note', fill(c.note)));
    return card;
  }

  // Once a card is answered, typed "confirm" / "cancel" no longer refer to it.
  // Its buttons keep their default state and can still be tapped.
  function lockCard(card) {
    if (card && openCard === card) openCard = null;
  }

  function cardAction(card, choice) {
    if (pending) return;
    document.activeElement?.blur();
    lockCard(card);
    reply(card._actions[choice]);
  }

  // Fills the assistant message that is showing "Thinking...". The first block
  // takes the indicator's place in the same frame, so nothing jumps.
  async function addAssistant(step, id, m, blocks, thinking) {
    const stream = (step.stream ?? scenario.stream ?? false) && !reduceMotion.matches;
    const ms = step.streamMs ?? scenario.streamMs ?? 30;
    log.setAttribute('aria-busy', 'true');

    const cards = [];
    for (const b of step.assistant ?? []) {
      if (id !== run) return;
      if (!b.card) thinking.remove();
      if (b.p != null) {
        const p = el('p');
        blocks.append(p);
        stream ? await typeInto(p, fill(b.p), ms, id) : (p.textContent = fill(b.p));
      } else if (b.ul) {
        const ul = el('ul');
        blocks.append(ul);
        for (const item of b.ul) {
          const li = el('li');
          ul.append(li);
          stream ? await typeInto(li, fill(item), ms, id) : (li.textContent = fill(item));
        }
      } else if (b.action) {
        // Pill-button inside the reply, e.g. "Try again"
        const a = b.action;
        const btn = el('button', 'pill secondary');
        btn.type = 'button';
        if (a.icon) btn.insertAdjacentHTML('beforeend', ICONS[a.icon] ?? '');
        btn.append(el('span', null, a.label));
        btn.addEventListener('click', () => {
          if (pending) return;
          document.activeElement?.blur();
          reply(a.next);
        });
        blocks.append(btn);
      } else if (b.card) {
        cards.push(b.card);
      }
      toBottom();
    }
    thinking.remove();
    // As in Figma: text, its timestamp, then the card below.
    m.append(el('span', 'time', clock()));
    for (const c of cards) {
      const card = renderCard(c);
      m.append(card);
      if (card._actions) openCard = card;
    }
    log.setAttribute('aria-busy', 'false');
    toBottom();
  }

  // Plays the assistant's side of a turn: thinking, then the reply.
  async function reply(nextId) {
    const id = run;
    const step = scenario.steps[nextId];
    pending = true;
    userScrolled = false;
    updateSend();

    await wait(350);
    if (id !== run) return;
    const m = el('div', 'msg assistant');
    const blocks = el('div', 'blocks');
    const thinking = el('div', 'thinking');
    thinking.append(el('span', null, 'Thinking...'));
    blocks.append(thinking);
    m.append(el('span', 'sr-only', 'Assistant said: '), blocks);
    log.append(m);
    toBottom();

    await wait(step.thinkingMs ?? 1000);
    if (id !== run) return;
    await addAssistant(step, id, m, blocks, thinking);
    if (id !== run) return;

    // Final check once the entrance animation is over: make sure the end of
    // the reply (e.g. the bottom of a card) isn't left under the message box.
    setTimeout(() => {
      if (id === run && !userScrolled) { scrollAnim = null; toBottom(); }
    }, MOTION_ENTER + 50);

    // A fallback keeps the conversation where it was, so the user can retry.
    if (nextId !== scenario.fallback) stepId = nextId;
    pending = false;
    updateSend();
    updateHint();
    input.focus({ preventScroll: true });
  }

  function submit(text) {
    text = text.trim();
    if (!text || pending) return;

    if (!started) {
      started = true;
      app.dataset.screen = 'chat';
      log.append(el('div', 'date-badge', `Today ${clock()}`));
    }

    input.value = '';
    addUser(text);

    const rule = resolve(text);
    // Typing "confirm" or "cancel" answers the open card, same as tapping it.
    if (rule.card || rule.next !== scenario.fallback) lockCard(openCard);
    reply(rule.next);
  }

  function load(id) {
    run++;
    scenario = data.scenarios.find((s) => s.id === id) ?? data.scenarios[0];
    stepId = scenario.start;
    started = false;
    pending = false;
    openCard = null;
    log.replaceChildren();
    log.setAttribute('aria-busy', 'false');
    app.dataset.screen = 'intro';
    // Replay the intro entrance on Restart, even when it's already showing
    for (const a of app.querySelector('.intro').getAnimations({ subtree: true })) {
      if (a.animationName === 'intro-in') { a.cancel(); a.play(); }
    }
    greeting.textContent = fill(scenario.greeting ?? 'Hi {firstName}, how can I help?');
    input.value = '';
    updateSend();
    updateHint();
    renderExamples();
  }

  // "Try a script" dropdown: picking a script fills the message box. Picking
  // a flow with "chips" (Spending insights, Balance inquiry) shows its
  // scenarios as chips instead; tapping a chip fills the message box.
  const examples = $('examples'), chips = $('chips');
  let group = ''; // dropdown value of the flow whose chips are showing
  function useExample(text) {
    input.value = text;
    updateSend();
    input.focus({ preventScroll: true });
  }
  function renderExamples() {
    examples.replaceChildren(new Option('Choose a script', ''));
    (scenario.examples ?? []).forEach((ex, i) => examples.append(new Option(ex.label, i)));
    if (!scenario.examples?.[group]?.chips) group = '';
    examples.value = group;
    renderChips();
  }
  function renderChips() {
    const items = scenario.examples?.[group]?.chips ?? [];
    chips.hidden = !items.length;
    chips.replaceChildren(...items.map((c) => {
      const chip = el('button', 'chip', c.label);
      chip.type = 'button';
      chip.addEventListener('click', () => useExample(c.text));
      return chip;
    }));
  }
  examples.addEventListener('change', () => {
    const ex = scenario.examples?.[examples.value];
    if (ex?.chips) { group = examples.value; renderChips(); return; }
    group = '';
    renderChips();
    if (!ex) return;
    useExample(ex.text);
    examples.value = '';
  });

  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $('theme-light').setAttribute('aria-pressed', t === 'light');
    $('theme-dark').setAttribute('aria-pressed', t === 'dark');
  }

  // Wiring
  $('composer').addEventListener('submit', (e) => { e.preventDefault(); submit(input.value); });
  input.addEventListener('input', updateSend);
  $('new-chat').addEventListener('click', () => load(scenario.id));
  $('close').addEventListener('click', () => {}); // Not designed yet

  $('restart').addEventListener('click', () => load(scenario.id));
  $('fill').addEventListener('click', () => {
    const s = scenario.steps[stepId]?.suggestedInput;
    if (!s) return;
    input.value = s;
    updateSend();
    input.focus({ preventScroll: true });
  });
  // Controls popup: toggle button, Escape or a click outside closes it.
  const toggle = $('demo-toggle'), panel = $('demo');
  function setPanel(open) {
    panel.hidden = !open;
    toggle.setAttribute('aria-expanded', open);
  }
  toggle.addEventListener('click', () => setPanel(panel.hidden));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !panel.hidden) { setPanel(false); toggle.focus(); }
  });
  document.addEventListener('pointerdown', (e) => {
    if (!panel.hidden && !panel.contains(e.target) && !toggle.contains(e.target)) setPanel(false);
  });

  $('theme-light').addEventListener('click', () => setTheme('light'));
  $('theme-dark').addEventListener('click', () => setTheme('dark'));

  load(data.scenarios[0].id);
})();
</script>
</body>
</html>
